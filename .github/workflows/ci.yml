name: Automotive E/E CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Simulation Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy matplotlib

    - name: Run Multi-Body Vehicle Dynamics Simulation
      run: |
        python simulation/virtual_steering_model.py

    - name: Compile Embedded C++ Firmware
      run: |
        g++ -std=c++17 -Wall -Wextra -O2 \
          -Ifirmware/include \
          firmware/src/main.cpp \
          firmware/src/impedance_controller.cpp \
          firmware/src/can_telemetry.cpp \
          firmware/src/sensor_drivers/as5600.cpp \
          -o sbw_firmware_bin
        ./sbw_firmware_bin

    - name: Test Telemetry Backend Gateway
      run: |
        python -c "
        import importlib.util
        spec = importlib.util.spec_from_file_location('telemetry_server', 'backend/telemetry_server.py')
        module = importlib.util.module_from_spec(spec)
        print('Backend module successfully verified.')
        "
